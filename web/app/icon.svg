<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- VIP brand mark: a "V" whose right arm rises past its origin — the
       value trajectory the platform exists to find. Gold on near-black,
       matching the product's gold/ink identity. -->
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#a66f18"/>
      <stop offset="0.6" stop-color="#ca9743"/>
      <stop offset="1" stop-color="#e0b566"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="#181a1f"/>
  <path d="M16 22 L28.5 46 L47.5 11.5"
        fill="none" stroke="url(#g)" stroke-width="7"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
